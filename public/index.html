<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סביבת הקורסים</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300;400;500;600&family=Assistant:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- סביבת הקורסים של ד״ר אדוה מרגליות.
     המרצה נכנסת בקוד מרצה לאזור הניהול ומוסיפה קורסים; סטודנטים נכנסים בקוד הקורס.
     הכול נבדק בשרת (netlify/functions/lib/core.mjs). -->
<style>
:root{
  --bg:#F6FAF9; --top:#E0F1E6; --ink:#13372A; --muted:#4A6359; --line:#BFDCCB; --card:#FFFFFF;
  --green:#1E7B3A; --green-2:#2FA34F; --green-soft:#E6F5EA; --section:#EEF7F3;
  --sky:#1F5F99; --sky-soft:#EAF3FA; --sky-line:#C6DCEE;
  --nav:#173B5C; --nav-ink:#EAF3FA; --nav-accent:#8FD6A2;
  --lilac:#6B3FA0; --lilac-soft:#F4EFFB; --lilac-line:#DCCFF0;
  --amber:#C77A12; --amber-soft:#FDF1DF; --coral:#C8463B; --coral-soft:#FBE9E7;
  --shadow:rgba(10,40,25,.14); --on-accent:#FFFFFF;
  --hero-a:#1E7B3A; --hero-b:#7CCB95;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1714; --top:#14231C; --ink:#E1EEE7; --muted:#9BB4A8; --line:#2A4337; --card:#16221D;
    --green:#6CCB8A; --green-2:#4FB86C; --green-soft:#17301F; --section:#121E19;
    --sky:#86B9E6; --sky-soft:#16263A; --sky-line:#284562;
    --nav:#0C1F31; --nav-ink:#DCEAF5; --nav-accent:#6CCB8A;
    --lilac:#B99BE6; --lilac-soft:#241B33; --lilac-line:#3B2E52;
    --amber:#F0B45A; --amber-soft:#33260F; --coral:#EE8A80; --coral-soft:#381A17;
    --shadow:rgba(0,0,0,.45); --on-accent:#0B1611;
    --hero-a:#12482A; --hero-b:#2C6E47;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1714; --top:#14231C; --ink:#E1EEE7; --muted:#9BB4A8; --line:#2A4337; --card:#16221D;
  --green:#6CCB8A; --green-2:#4FB86C; --green-soft:#17301F; --section:#121E19;
  --sky:#86B9E6; --sky-soft:#16263A; --sky-line:#284562;
  --nav:#0C1F31; --nav-ink:#DCEAF5; --nav-accent:#6CCB8A;
  --lilac:#B99BE6; --lilac-soft:#241B33; --lilac-line:#3B2E52;
  --amber:#F0B45A; --amber-soft:#33260F; --coral:#EE8A80; --coral-soft:#381A17;
  --shadow:rgba(0,0,0,.45); --on-accent:#0B1611;
  --hero-a:#12482A; --hero-b:#2C6E47;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Assistant,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.55;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--sky)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{display:inline-block;flex:none;vertical-align:middle;width:44px;height:44px}
.ic svg{display:block;width:100%;height:100%}

/* ---------- פס עליון ותפריט ---------- */
.hdr{position:sticky;top:0;z-index:50}
.top{display:flex;align-items:center;gap:10px 16px;min-height:54px;padding:6px 20px;background:var(--top);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
.brand .ic{width:34px;height:34px}
.brand-name{font:500 16px Heebo,sans-serif;color:var(--green);white-space:nowrap}
.brand-sep{width:1px;height:24px;background:currentColor;opacity:.25}
.brand-who{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-gap{flex:1 1 auto}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);white-space:nowrap}
.chip.l{border-color:var(--lilac-line);background:var(--lilac-soft);color:var(--lilac)}
.round{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 13px;border:1px solid currentColor;border-radius:999px;background:transparent;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;opacity:.85;white-space:nowrap}
.round:hover{opacity:1}
.nav{display:flex;flex-wrap:wrap;justify-content:center;gap:0 2px;padding:0 12px;background:var(--nav)}
.nav button{position:relative;display:flex;align-items:center;gap:7px;height:42px;padding:0 14px;border:0;background:transparent;color:var(--nav-ink);font:400 15px Heebo,sans-serif;letter-spacing:.2px;cursor:pointer;opacity:.9;white-space:nowrap}
.nav button .ic{width:18px;height:18px}
.nav button:hover,.nav button:focus-visible{opacity:1;outline:none;box-shadow:inset 0 -2px 0 var(--nav-accent)}
.nav button.on{opacity:1;box-shadow:inset 0 -3px 0 var(--nav-accent);font-weight:500}
.badge{min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:#F2A33A;color:#2A1A00;font:700 11.5px/19px Assistant,sans-serif;text-align:center}

/* ---------- באנר ---------- */
.hero{position:relative;margin-bottom:28px}
.hero-band{position:relative;height:230px;overflow:hidden;background:linear-gradient(160deg,var(--hero-a),var(--hero-b))}
.hero-band svg{position:absolute;inset:0;width:100%;height:100%}
.hero-row{position:relative;z-index:2;width:min(1180px,calc(100% - 32px));margin:-150px auto 0;display:flex;gap:18px;align-items:stretch}
.hero-card,.board{background:var(--card);border-radius:18px;box-shadow:0 14px 36px var(--shadow)}
.hero-card{flex:1.45 1 0;min-width:0;padding:24px 30px 22px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.eyebrow b{color:var(--ink);font-weight:600}
.hero-title{margin:0;font:300 clamp(30px,5vw,50px)/1.1 Heebo,sans-serif;letter-spacing:-.3px;color:var(--green)}
.hero-title.empty{color:var(--muted);font-size:clamp(24px,4vw,34px)}
.hero-about{margin:0;font-size:17px;color:var(--muted);white-space:pre-wrap}
.hero-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.board{flex:1 1 0;min-width:0;padding:16px 22px;border-top:3px solid var(--sky);display:flex;flex-direction:column;gap:8px}
.board h2{margin:0;font:500 15px Heebo,sans-serif;color:var(--sky);display:flex;align-items:center;gap:8px}
.board h2 .ic{width:22px;height:22px}
.board-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.board-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px;cursor:pointer}
.board-list li:last-child{border-bottom:0}
.board-list li:hover .bl-t{color:var(--green)}
.board-list .ic{width:30px;height:30px}
.bl-t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl-s{font-size:12.5px;color:var(--muted)}
.board-empty{color:var(--muted);font-size:14.5px;padding:10px 0}

/* ---------- תוכן ---------- */
main{min-height:40vh}
.wrap{width:min(1180px,calc(100% - 32px));margin:0 auto}
.narrow{width:min(860px,calc(100% - 32px));margin:0 auto}
.sec{background:var(--section);padding:46px 0 60px;margin-top:34px}
.sec-h{margin:0 0 28px;text-align:center;font:300 clamp(30px,5vw,42px)/1.2 Heebo,sans-serif;color:var(--green)}
.sec-sub{margin:-18px 0 26px;text-align:center;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:0 2px 10px rgba(10,40,25,.05)}
.card+.card{margin-top:16px}
.card-h{display:flex;align-items:center;gap:14px;margin:0 0 12px}
.card-h h2,.card-h h3{margin:0;font:400 24px/1.25 Heebo,sans-serif;color:var(--ink)}
.card-h .ic{width:52px;height:52px}
.card-h .grow{flex:1;min-width:0}
.card-h .sub{margin:2px 0 0;font-size:14px;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;margin:6px 0 14px;border:0;background:none;color:var(--sky);font-weight:700;cursor:pointer;padding:4px 0}
.page-h{display:flex;align-items:flex-start;gap:18px;margin:0 0 18px}
.page-h .ic{width:64px;height:64px}
.page-h h1{margin:0;font:300 clamp(28px,4.4vw,40px)/1.15 Heebo,sans-serif;color:var(--green)}
.page-h .sub{margin:6px 0 0;color:var(--muted);font-size:15.5px}
.page-n{font:200 54px/1 Heebo,sans-serif;color:var(--green);min-width:64px;text-align:center}

/* כפתורים */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 20px;border:1px solid var(--green);border-radius:999px;background:var(--green);color:var(--on-accent);font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .ic{width:18px;height:18px}
.btn.sky{background:var(--sky);border-color:var(--sky)}
.btn.lilac{background:var(--lilac);border-color:var(--lilac)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--green);color:var(--green);filter:none}
.btn.sm{min-height:32px;padding:0 13px;font-size:13.5px}
.btn.danger{background:transparent;color:var(--coral);border-color:var(--coral-soft)}
.btn.danger:hover{background:var(--coral-soft);filter:none}
.mini{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.mini:hover{border-color:var(--green);color:var(--green)}
.mini.view{border-color:var(--sky-line);color:var(--sky);background:var(--sky-soft)}
.mini.down{border-color:var(--line);color:var(--green);background:var(--green-soft)}
.mini.edit{color:var(--lilac);border-color:var(--lilac-line)}
.mini.del{color:var(--coral);border-color:var(--coral-soft)}
.mini.icon{width:32px;padding:0}
.mini svg{width:15px;height:15px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* כרטיסי שיעורים */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}
.lesson{text-decoration:none;display:flex;flex-direction:column;padding:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;color:var(--ink);text-align:right;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease}
.lesson:hover,.lesson:focus-visible{transform:translateY(-4px);box-shadow:0 14px 30px var(--shadow);outline:none}
.lesson-art{display:block;height:118px;background:var(--section);overflow:hidden}
.lesson-art svg{display:block;width:100%;height:100%}
.float{transform-origin:100px 60px;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.lesson:hover .float{transform:scale(1.06) rotate(-2deg) translateY(-3px)}
.lesson-body{display:flex;flex-direction:column;gap:9px;padding:16px 18px 18px;flex:1}
.lesson-n{font:200 36px/1 Heebo,sans-serif;color:var(--green)}
.lesson-rule{width:28px;height:1px;background:var(--ink);opacity:.35}
.lesson-title{font:400 17px/1.35 Heebo,sans-serif}
.lesson-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--card)}
.tag.task{border-color:var(--lilac-line);color:var(--lilac);background:var(--lilac-soft)}
.tag.date{border-color:var(--sky-line);color:var(--sky);background:var(--sky-soft)}
.tag.new{border-color:#F2C37A;color:var(--amber);background:var(--amber-soft)}
.lesson.add{align-items:center;justify-content:center;gap:10px;min-height:250px;border:1.5px dashed var(--line);background:transparent;color:var(--green);font:500 16px Heebo,sans-serif}
.lesson.add .ic{width:58px;height:58px}

/* סילבוס ברשימה בדף הבית */
.syl-preview{position:relative;max-height:150px;overflow:hidden}
.syl-preview::after{content:"";position:absolute;inset:auto 0 0 0;height:60px;background:linear-gradient(to bottom,transparent,var(--card))}
.rich{font-size:16.5px;line-height:1.75}
.rich p{margin:0 0 12px}
.rich h3{font:500 19px/1.35 Heebo,sans-serif;color:var(--green);margin:20px 0 8px}
.rich h3:first-child{margin-top:0}
.rich ul,.rich ol{margin:0 0 12px;padding-inline-start:24px}
.rich li{margin:3px 0}
.rich li::marker{color:var(--green-2)}
.rich a{word-break:break-all}
.muted{color:var(--muted)}
.hint{font-size:13.5px;color:var(--muted);margin:6px 0 0}

/* פריטים: קבצים וקישורים */
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);transition:border-color .15s}
.item:hover{border-color:var(--green-2)}
.ft{width:46px;height:46px;flex:none;border-radius:12px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--card));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:700 9.5px/1 Assistant,sans-serif;letter-spacing:.4px}
.ft svg{width:22px;height:22px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ft{filter:brightness(1.35)} }
:root[data-theme="dark"] .ft{filter:brightness(1.35)}
.item-main{flex:1;min-width:0}
.item-t{font-weight:700;font-size:15.5px;overflow-wrap:anywhere}
.item-s{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.item-note{font-size:14px;color:var(--muted);margin-top:3px;white-space:pre-wrap}
.item-acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.adder{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.prog{height:6px;border-radius:99px;background:var(--section);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green-2),var(--sky));transition:width .2s}

/* טפסים */
label.f{display:block;font-size:14px;font-weight:700;color:var(--ink);margin:14px 0 5px}
label.f small{font-weight:400;color:var(--muted)}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 13px;font-size:15.5px;color:var(--ink)}
input.t:focus,select.t:focus,textarea.t:focus{outline:2px solid var(--green-2);outline-offset:0;border-color:transparent}
textarea.t{min-height:120px;resize:vertical;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.check{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:14.5px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--green)}
.drop{margin-top:6px;border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;background:var(--bg);cursor:pointer;transition:border-color .15s,background .15s}
.drop.over,.drop:hover{border-color:var(--green-2);background:var(--green-soft)}
.drop .ic{width:46px;height:46px;margin:0 auto 6px;display:block}
.drop b{color:var(--green)}
.files-chosen{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.files-chosen li{display:flex;align-items:center;gap:10px;font-size:14px;background:var(--section);border-radius:10px;padding:6px 10px}
.files-chosen li .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.datechip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--sky-soft);color:var(--sky);font-weight:700;font-size:14px}
.datechip .ic{width:18px;height:18px}
.msg{border-radius:12px;padding:12px 15px;margin-top:14px;font-size:15px}
.msg.ok{background:var(--green-soft);color:var(--green);border:1px solid var(--line)}
.msg.err{background:var(--coral-soft);color:var(--coral);border:1px solid var(--coral-soft)}
.msg.info{background:var(--sky-soft);color:var(--sky);border:1px solid var(--sky-line)}
.formcols{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
.aside{background:var(--section);border-radius:18px;padding:20px 22px;font-size:14.5px;color:var(--muted)}
.aside h3{margin:0 0 8px;font:500 17px Heebo,sans-serif;color:var(--ink);display:flex;align-items:center;gap:8px}
.aside h3 .ic{width:26px;height:26px}
.aside ul{margin:0;padding-inline-start:18px}
.aside li{margin:4px 0}

/* תיבת ההגשות וההודעות */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.filters button{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13.5px;font-weight:600}
.filters button.on{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.entry{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:16px 18px;display:flex;gap:14px}
.entry+.entry{margin-top:10px}
.entry.unseen{border-color:var(--green-2);box-shadow:inset -4px 0 0 var(--green-2)}
.entry .ava{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:500 17px Heebo,sans-serif;color:#fff}
.entry-main{flex:1;min-width:0}
.entry-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.entry-h b{font-size:16px}
.entry-h span{font-size:13px;color:var(--muted)}
.entry-text{margin:8px 0 0;white-space:pre-wrap;font-size:15px}
.entry-files{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.entry-file{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--section);border-radius:10px;padding:6px 10px;font-size:14px}
.entry-file .ft{width:32px;height:32px;border-radius:9px;font-size:0}
.entry-file .ft svg{width:17px;height:17px}
.entry-file .nm{flex:1;min-width:120px;overflow-wrap:anywhere}
.entry-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

/* קוד לסטודנטים */
.codebox{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px}
.bigcode{font:500 34px/1 Heebo,monospace;letter-spacing:3px;color:var(--green);background:var(--green-soft);border:1px dashed var(--green-2);border-radius:14px;padding:14px 22px;direction:ltr}
.qr{background:#fff;padding:10px;border-radius:12px;width:max-content;margin-top:12px}
.ready{white-space:pre-wrap;background:var(--section);border-radius:12px;padding:12px 14px;font-size:14.5px;margin-top:10px}

/* מסך כניסה */
.gate{min-height:100vh;display:flex;flex-direction:column}
.gate-band{position:relative;flex:0 0 300px;overflow:hidden;background:linear-gradient(160deg,var(--hero-a),var(--hero-b))}
.gate-band svg{position:absolute;inset:0;width:100%;height:100%}
.gate-card{position:relative;z-index:2;width:min(480px,calc(100% - 32px));margin:-190px auto 40px;background:var(--card);border-radius:22px;box-shadow:0 18px 44px var(--shadow);padding:30px 32px 26px;text-align:center}
.gate-card .ic.big{width:84px;height:84px;margin:-74px auto 8px;display:block;background:var(--card);border-radius:50%;padding:12px;box-shadow:0 8px 20px var(--shadow)}
.gate-card h1{margin:4px 0 4px;font:300 32px/1.2 Heebo,sans-serif;color:var(--green)}
.gate-card .who{margin:0 0 18px;color:var(--muted)}
.codein{width:100%;text-align:center;font:500 24px Heebo,sans-serif;letter-spacing:3px;direction:ltr;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.codein:focus{outline:2px solid var(--green-2);border-color:transparent}
.gate-card .btn{width:100%;margin-top:14px;min-height:46px;font-size:16px}
.gate-card .check{justify-content:center}
.gate-foot{margin-top:auto;text-align:center;font-size:13px;color:var(--muted);padding:18px}

/* חלון */
dialog.dlg{border:0;border-radius:20px;padding:0;width:min(560px,calc(100% - 24px));background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.3)}
dialog.dlg::backdrop{background:rgba(8,30,20,.45)}
.dlg-h{display:flex;align-items:center;gap:12px;padding:18px 22px;background:var(--section);border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font:400 22px Heebo,sans-serif;color:var(--green);flex:1}
.dlg-h .ic{width:40px;height:40px}
.dlg-b{padding:4px 22px 6px;max-height:min(70vh,640px);overflow:auto}
.dlg-f{display:flex;gap:8px;justify-content:flex-start;padding:14px 22px 18px;flex-wrap:wrap}
.x{border:0;background:transparent;font-size:24px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:8px}

.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--nav);color:var(--nav-ink);padding:10px 20px;border-radius:999px;font-weight:600;font-size:14.5px;opacity:0;transition:all .25s;z-index:1000;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:80px 16px;color:var(--muted)}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--green);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
footer{padding:28px 16px 34px;text-align:center;color:var(--muted);font-size:13px;background:var(--section);margin-top:44px}
footer img{height:22px;vertical-align:middle;margin-inline-start:6px;opacity:.8}

/* ניהול: רשימת קורסים */
.course-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.course-row .grow{flex:1;min-width:220px}
.kv{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);margin-top:6px}
.kv b{color:var(--ink);font-family:Heebo,monospace;letter-spacing:1px;direction:ltr;unicode-bidi:isolate}

@media (max-width:900px){
  .hero-row{flex-direction:column}
  .formcols{grid-template-columns:1fr}
}
@media (max-width:640px){
  .top{padding:6px 14px}
  .brand-who,.brand-sep,.top .chip{display:none}
  .top{flex-wrap:nowrap}
  .nav{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;padding:0 6px;scrollbar-width:none}
  .nav button{padding:0 11px;font-size:14px}
  .hero-band{height:170px}
  .hero-row{margin-top:-120px;width:calc(100% - 24px)}
  .hero-card{padding:20px 20px 18px}
  .wrap,.narrow{width:calc(100% - 32px)}
  .card{padding:18px 16px}
  .two{grid-template-columns:1fr}
  .item{flex-wrap:wrap}
  .item-acts{width:100%;justify-content:flex-start;padding-inline-start:60px}
  .lessons{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .lesson-art{height:90px}
  .page-n{font-size:40px;min-width:46px}
  .bigcode{font-size:26px;padding:10px 16px}
}
@media print{
  .hdr,.hero-band,.hero-actions,.item-acts,.adder,footer,.back,.btn,.mini{display:none!important}
  @page{size:A4;margin:18mm 20mm}
  body{background:#fff}
  .card,.item,.entry{break-inside:avoid}
  h1,h2,h3{break-after:avoid}
}
</style>

<script>

const fmtDate = (d) => { if (!d) return ""; const x = new Date(d.length === 10 ? d + "T12:00:00" : d); return isNaN(x) ? "" : x.toLocaleDateString("he-IL", { day:"numeric", month:"numeric", year:"numeric" }); };

const fmtSize = (b) => !b ? "" : b < 1024 * 1024 ? Math.max(1, Math.round(b / 1024)) + " KB" : (b / 1024 / 1024).toFixed(b < 10 * 1024 * 1024 ? 1 : 0) + " MB";

// מקלדת בעברית: הקודים באותיות לטיניות — ממירים לפי מיקום המקש (כמו ב-entry.html)

async function copy(text, done){ try { await navigator.clipboard.writeText(text); toast(done || "הועתק"); } catch(e){ prompt("להעתקה:", text); } }

/* ───────── איקונים מעוצבים (SVG, צבעוניים, בשפה של הספר הירוק) ───────── */

const ICON = {
  // ספר פתוח — סילבוס
  book(){ const [a, da] = G("#2FA34F", "#3C8FC4"), [b, db] = G("#7E57C2", "#3C8FC4");

  layers(){ const [a, da] = G("#3C8FC4", "#7E57C2"), [b, db] = G("#2FA34F", "#3C8FC4");

  upload(){ const [a, da] = G("#2FA34F", "#1E7B3A"), [b, db] = G("#3C8FC4", "#7E57C2");
    return `<svg viewBox="0 0 48 48"><defs>${da}${db}</defs><rect x="7" y="25" width="34" height="16" rx="5" fill="url(#${b})" opacity=".3"/><path d="M7 30v6a5 5 0 0 0 5 5h24a5 5 0 0 0 5-5v-6" stroke="url(#${b})" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M24 31V9m0 0-8 8m8-8 8 8" stroke="url(#${a})" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="38" cy="10" r="3" fill="#F2A33A"/></svg>`; },
  // מעטפה — הודעה למרצה
  letter(){ const [a, da] = G("#3C8FC4", "#1F5F99"), [b, db] = G("#7E57C2", "#3C8FC4");
    return `<svg viewBox="0 0 48 48"><defs>${da}${db}</defs><rect x="6" y="12" width="36" height="26" rx="6" fill="url(#${a})"/><path d="m8 15 16 12 16-12" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/><path d="M33 6c4 1 7 4 8 8" stroke="url(#${b})" stroke-width="2.6" stroke-linecap="round" fill="none"/><circle cx="42" cy="17" r="2.6" fill="#F2A33A"/></svg>`; },
  // תיבה — ההגשות
  inbox(){ const [a, da] = G("#2FA34F", "#3C8FC4"), [b, db] = G("#7E57C2", "#B07FE0");
    return `<svg viewBox="0 0 48 48"><defs>${da}${db}</defs><rect x="13" y="6" width="22" height="16" rx="3" fill="url(#${b})" opacity=".55" transform="rotate(-6 24 14)"/><path d="M6 26h11l3 5h8l3-5h11v9a6 6 0 0 1-6 6H12a6 6 0 0 1-6-6z" fill="url(#${a})"/><path d="M6 26l5-10h26l5 10" stroke="url(#${a})" stroke-width="2.4" fill="none" stroke-linejoin="round"/><circle cx="40" cy="9" r="3" fill="#F2A33A"/></svg>`; },
  // בועות שיחה — הודעות
  chat(){ const [a, da] = G("#3C8FC4", "#7E57C2"), [b, db] = G("#2FA34F", "#8FD6A2");
    return `<svg viewBox="0 0 48 48"><defs>${da}${db}</defs><path d="M8 10h22a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H17l-7 6v-6H8a5 5 0 0 1-5-5V15a5 5 0 0 1 5-5z" fill="url(#${a})"/><path d="M38 18h2a5 5 0 0 1 5 5v9a5 5 0 0 1-5 5h-1v5l-6-5h-9a5 5 0 0 1-5-5" fill="url(#${b})" opacity=".8"/><circle cx="12" cy="20" r="1.8" fill="#fff"/><circle cx="19" cy="20" r="1.8" fill="#fff"/><circle cx="26" cy="20" r="1.8" fill="#fff"/></svg>`; },

    return `<svg viewBox="0 0 48 48"><defs>${da}${db}</defs><path d="M24 9 3 19l21 10 21-10z" fill="url(#${a})"/><path d="M12 24v8c0 3.5 5.4 6.5 12 6.5S36 35.5 36 32v-8l-12 5.6z" fill="url(#${b})" opacity=".85"/><path d="M41 21v10" stroke="#F2A33A" stroke-width="2.4" stroke-linecap="round"/><circle cx="41" cy="33" r="2.8" fill="#F2A33A"/></svg>`; },

    return `<svg viewBox="0 0 24 24"><defs>${da}</defs><rect x="3" y="5" width="18" height="16" rx="4" fill="url(#${a})"/><path d="M3 10h18" stroke="#fff" stroke-width="1.6"/><path d="M8 3v4M16 3v4" stroke="#1F5F99" stroke-width="2" stroke-linecap="round"/></svg>`; },
  plus(){ const [a, da] = G("#2FA34F", "#3C8FC4");
    return `<svg viewBox="0 0 48 48"><defs>${da}</defs><circle cx="24" cy="24" r="20" fill="url(#${a})" opacity=".14"/><circle cx="24" cy="24" r="14" fill="url(#${a})"/><path d="M24 17v14M17 24h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>`; },
  sparkle(){ const [a, da] = G("#F2A33A", "#7E57C2");
    return `<svg viewBox="0 0 24 24"><defs>${da}</defs><path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7z" fill="url(#${a})"/><circle cx="19" cy="19" r="2" fill="#2FA34F"/></svg>`; },
};
const icon = (name, cls) => el("span", { class: "ic" + (cls ? " " + cls : ""), "aria-hidden": "true", html: ICON[name]() });
// איקונים קטנים בקו — לכפתורי פעולה
const LINE = {
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-5-5m5 5 5-5M5 20h14"/></svg>',
  open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4 10 14M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',

  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  img: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',
  table: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M10 4v16"/></svg>',

  zip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M11 6h1M11 9h1M11 12h1M10.5 15h2v3h-2z"/></svg>',

};
const line = (n) => el("span", { class: "ic", style: "width:16px;height:16px", "aria-hidden": "true", html: LINE[n] });

// סוג הקובץ — צבע, תווית ואיקון
const FT = {
  pdf:   { label: "PDF",  icon: "file",   c: "#C8463B", bg: "#FBE9E7" },
  doc:   { label: "WORD", icon: "file",   c: "#2B6CB0", bg: "#E6F0FA" },
  ppt:   { label: "מצגת", icon: "slides", c: "#D86A1E", bg: "#FDEEDF" },
  xls:   { label: "גיליון", icon: "table", c: "#1E7B3A", bg: "#E6F5EA" },
  img:   { label: "תמונה", icon: "img",   c: "#0E8A86", bg: "#E0F4F2" },
  vid:   { label: "וידאו", icon: "play",  c: "#6B3FA0", bg: "#F1EAFA" },
  aud:   { label: "שמע",  icon: "play",   c: "#8A4FB5", bg: "#F3EAFA" },
  zip:   { label: "ZIP",  icon: "zip",    c: "#5B6B66", bg: "#ECEFEE" },
  yt:    { label: "וידאו", icon: "play",  c: "#D93025", bg: "#FCE8E6" },
  gdoc:  { label: "Drive", icon: "link",  c: "#1F5F99", bg: "#E3EEF8" },
  link:  { label: "קישור", icon: "link",  c: "#1F5F99", bg: "#E3EEF8" },
  other: { label: "קובץ", icon: "file",   c: "#4A6359", bg: "#EEF7F3" },
};
function ftOf(it){
  if (it.kind === "link") {
    const u = it.url || "";
    if (/youtu\.?be|vimeo\.com/i.test(u)) return "yt";
    if (/docs\.google|drive\.google|onedrive|sharepoint|dropbox/i.test(u)) return "gdoc";
    return "link";
  }
  const n = (it.name || "").toLowerCase(), t = (it.type || "").toLowerCase();
  const ext = (n.match(/\.([a-z0-9]+)$/) || [])[1] || "";
  if (ext === "pdf" || t.includes("pdf")) return "pdf";
  if (/^(docx?|odt|rtf|txt|pages)$/.test(ext)) return "doc";
  if (/^(pptx?|odp|key)$/.test(ext)) return "ppt";
  if (/^(xlsx?|ods|csv|numbers)$/.test(ext)) return "xls";
  if (/^(png|jpe?g|gif|webp|svg|heic|bmp)$/.test(ext) || t.startsWith("image/")) return "img";
  if (/^(mp4|mov|webm|m4v|avi|mkv)$/.test(ext) || t.startsWith("video/")) return "vid";
  if (/^(mp3|m4a|wav|ogg|aac)$/.test(ext) || t.startsWith("audio/")) return "aud";
  if (/^(zip|rar|7z)$/.test(ext)) return "zip";
  return "other";
}

/* ───────── טקסט עשיר לסילבוס: # כותרת, - תבליט, 1. רשימה, **מודגש**, קישורים ───────── */
function inline(s){
  const out = [];
  const re = /(\*\*([^*]+)\*\*)|(https?:\/\/[^\s)]+)/g;
  let last = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > last) out.push(s.slice(last, m.index));
    if (m[2]) out.push(el("strong", {}, m[2]));
    else out.push(el("a", { href: m[3], target: "_blank", rel: "noopener" }, m[3]));
    last = re.lastIndex;
  }
  if (last < s.length) out.push(s.slice(last));
  return out;
}
function rich(text){
  const box = el("div", { class: "rich" });
  let list = null, para = [];
  const flush = () => { if (para.length) { box.append(el("p", {}, inline(para.join(" ")))); para = []; } };
  for (const raw of String(text || "").split("\n")) {
    const ln = raw.trim();
    let m;
    if (!ln) { flush(); list = null; continue; }
    if ((m = ln.match(/^#{1,4}\s+(.*)$/))) { flush(); list = null; box.append(el("h3", {}, inline(m[1].replace(/\*\*/g, "")))); continue; }
    if ((m = ln.match(/^[-•*]\s+(.*)$/))) { flush(); if (!list || list.tagName !== "UL") { list = el("ul"); box.append(list); } list.append(el("li", {}, inline(m[1]))); continue; }
    if ((m = ln.match(/^\d+[.)]\s+(.*)$/))) { flush(); if (!list || list.tagName !== "OL") { list = el("ol"); box.append(list); } list.append(el("li", {}, inline(m[1]))); continue; }
    list = null; para.push(ln);
  }
  flush();
  return box;
}

const LECT = "adva.lect";
const KEY = CID ? "adva.c." + CID : LECT;

let S = store.get(LECT) || (CID ? store.get(KEY) : null) || null; // { token, role, code? }
const sessKey = () => (S && S.role === "l") ? LECT : KEY;
async function post(action, extra, opts){
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 45000);
  try {
    const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, signal: ctrl.signal,
      body: JSON.stringify({ action, cid: CID, token: (opts && opts.token) || (S && S.token) || "", ...extra }) });
    const d = await r.json().catch(() => ({}));
    return { status: r.status, ...d };
  } catch(e){ return { status: 0, error: "down" }; }
  finally { clearTimeout(timer); }
}
// בקשה עם כניסה: אם האסימון פג ושמור קוד במכשיר — נכנסים שוב בשקט ומנסים פעם נוספת
async function call(action, extra){
  let d = await post(action, extra);
  if (d.status === 401 && S && S.code) {
    const re = await post("login", { code: S.code, sid: store.get(SIDKEY) || "" }, { token: "-" });
    if (re.token) { S = { ...S, token: re.token, role: re.role }; store.set(sessKey(), S); d = await post(action, extra); }
  }
  if (d.status === 401) { store.del(sessKey()); S = null; renderGate("הכניסה הסתיימה. הקלידו שוב את הקוד."); throw new Error("login"); }
  return d;
}

// העלאת קובץ: כרטיס מהשרת, ואז העלאה בחלקים של עד 3MB (מגבלת הבקשה לשרת), עם התקדמות
async function upload(file, purpose, onProgress){
  const d = await call("upload", { purpose, name: file.name, size: file.size, type: file.type });
  if (!d.ticket) throw new Error(d.error === "too-big" ? "הקובץ \"" + file.name + "\" גדול מ-" + fmtSize(d.max) + "." : errText(d));
  for (let n = 0; n < d.parts; n++) {
    const part = file.slice(n * d.chunk, Math.min(file.size, (n + 1) * d.chunk));
    let ok = false;
    for (let attempt = 0; attempt < 3 && !ok; attempt++) { // ניסיון חוזר על חלק שנכשל (רשת חלשה)
      await new Promise((res) => {
        const x = new XMLHttpRequest();
        x.open("PUT", API + "/chunk?n=" + n);
        x.setRequestHeader("x-ticket", d.ticket);
        x.setRequestHeader("content-type", "application/octet-stream");
        x.upload.onprogress = (e) => { if (e.lengthComputable && onProgress) onProgress((n * d.chunk + e.loaded) / file.size); };
        x.onload = () => { ok = x.status >= 200 && x.status < 300; res(); };
        x.onerror = () => res();
        x.send(part);
      });
    }
    if (!ok) throw new Error("ההעלאה של \"" + file.name + "\" נכשלה. בדקו את החיבור ונסו שוב.");
  }
  if (onProgress) onProgress(1);
  return { path: d.path, name: file.name, size: file.size, type: file.type };
}
// צפייה / הורדה: הקובץ נטען בחלקים עם כרטיס קצר מועד, ונפתח מהדפדפן.
// החלון לצפייה נפתח מיד (כדי שהדפדפן לא יחסום אותו), והקובץ נטען לתוכו כשהוא מוכן.
async function openFile(it, download){
  const w = download ? null : window.open("", "_blank");
  if (w) { try { w.document.write('<p dir="rtl" style="font-family:Assistant,Arial;padding:30px;color:#4A6359">פותחת את הקובץ...</p>'); } catch(e){} }
  if (download) toast("מורידה את \"" + it.name + "\"...");
  try {
    const d = await call("file", { path: it.path });
    if (!d.ticket) throw new Error(d.error === "missing" ? "הקובץ לא נמצא." : errText(d));
    const parts = [];
    for (let n = 0; n < d.parts; n++) {
      const r = await fetch(API + "/chunk?n=" + n, { headers: { "x-ticket": d.ticket } });
      if (!r.ok) throw new Error("הקובץ לא נטען. נסו שוב.");
      parts.push(await r.blob());
    }
    const blob = new Blob(parts, { type: d.type || it.type || "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    if (w) w.location.href = url;
    else { const a = el("a", { href: url, download: it.name }); document.body.append(a); a.click(); a.remove(); }
    setTimeout(() => URL.revokeObjectURL(url), 10 * 60e3);
  } catch(e){ if (w) w.close(); if (e.message !== "login") toast(e.message); }
}

async function renderGate(note){
  document.title = "כניסה · סביבת הקורסים";
  $app.textContent = "";
  const pub = await post("public", {}, { token: "-" });
  const code = el("input", { class: "codein", placeholder: "XXXX-XXXX", autocomplete: "off", spellcheck: "false", "aria-label": "הקוד" });
  const pre = (location.hash.match(/k=([A-Za-z0-9-]{4,20})/) || [])[1];
  if (pre) code.value = pre.toUpperCase();
  const keep = el("input", { type: "checkbox", checked: true });
  const err = el("div", { class: "msg err" }); err.hidden = !note; if (note) err.textContent = note;
  if (CID && pub.status === 200 && !pub.found) { err.textContent = "הקורס בקישור לא נמצא. אפשר להיכנס עם הקוד שקיבלתם."; err.hidden = false; }
  const btn = el("button", { class: "btn" }, "כניסה");
  const go = async () => {
    const c = fixKeys(code.value).trim();
    if (!c) { err.textContent = "צריך להקליד את הקוד."; err.hidden = false; return; }
    btn.disabled = true; btn.textContent = "בודקת...";
    const d = await post("login", { code: c, sid: store.get(SIDKEY) || "" }, { token: "-" });
    btn.disabled = false; btn.textContent = "כניסה";
    if (!d.token) { err.textContent = d.error === "down" ? ERR.down : "הקוד לא מוכר. בדקו שהוא הוקלד נכון."; err.hidden = false; return; }
    store.set(SIDKEY, d.sid);
    const sess = { token: d.token, role: d.role, code: keep.checked ? c : undefined };
    if (d.role === "l") { store.set(LECT, sess); location.href = location.pathname + (CID ? "?c=" + CID : ""); return; }
    store.set("adva.c." + d.cid, sess);
    if (d.cid !== CID) { location.href = location.pathname + "?c=" + d.cid; return; }
    S = sess; history.replaceState(null, "", location.pathname + location.search); boot();
  };
  btn.addEventListener("click", go);
  code.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  code.addEventListener("input", () => { const v = fixKeys(code.value); if (v !== code.value) code.value = v; });
  $app.append(el("div", { class: "gate fade" },
    el("div", { class: "gate-band", html: bandArt() }),
    el("div", { class: "gate-card" }, icon("cap", "big"),
      el("h1", {}, pub.title || "סביבת הקורסים"),
      el("p", { class: "who" }, pub.lecturer || ""),
      el("label", { class: "f", style: "text-align:right" }, "הקוד שלך"), code, err, btn,
      el("label", { class: "check" }, keep, "להישאר מחובר/ת במכשיר הזה"),
      el("p", { class: "hint" }, "סטודנטים — קוד הקורס שקיבלתם. מרצה — קוד המרצה.")),
    el("div", { class: "gate-foot" }, "סביבת הקורסים" + (pub.lecturer ? " · " + pub.lecturer : ""))));
  if (!pre) code.focus();
}

function fileDrop(max, multiple){

      el("button", { class: "mini icon del", "aria-label": "הסרה", onclick: () => { chosen.splice(i, 1); draw(); } }, line("trash")))));
  };

      if (!multiple) chosen.length = 0;

  drop.addEventListener("dragleave", () => drop.classList.remove("over"));

}

        isInline(m.file) ? el("button", { class: "mini view", onclick: () => openFile(m.file, false) }, line("eye"), "צפייה") : null, el("button", { class: "mini down", onclick: () => openFile(m.file, true) }, line("down"), "הורדה")));

      const acts = el("div", { class: "entry-acts" });

      acts.append(el("button", { class: "mini" + (m.seen ? "" : " down"), onclick: async () => { await call("msgSeen", { id: m.id, seen: !m.seen }); await reload(); load(); } }, line("check"), m.seen ? "סימון כחדשה" : "סימון כנקראה"),
        el("button", { class: "mini del", onclick: async () => { if (!(await confirmBox("מחיקת ההודעה", "ההודעה תימחק מהאתר (לא מהמייל)."))) return; const r = await call("msgDelete", { id: m.id }); if (r.ok) { await reload(); load(); } } }, line("trash"), "מחיקה"));
      box.append(el("div", { class: "entry" + (m.seen ? "" : " unseen") }, avatar(m.name),
        el("div", { class: "entry-main" },
          el("div", { class: "entry-h" }, el("b", {}, m.name), el("span", {}, fmtWhen(m.at)), m.email ? el("span", { dir: "ltr" }, m.email) : null, !m.seen ? el("span", { class: "tag new" }, "חדשה") : null),
          el("p", { class: "entry-text" }, m.text), files, acts)));
    }
  };
  load();
}

function viewSettings(page){

  const link = base + "#k=" + C.studentCode;
  const ready = "שלום לכולם,\nזה אתר הקורס" + (C.title ? " \"" + C.title + "\"" : "") + " — סילבוס, חומרי השיעורים, הגשת תוצרים והודעות אליי.\nכניסה: " + link + "\nקוד הקורס: " + C.studentCode + "\n" + (C.lecturer || "");

  const qrBtn = el("button", { class: "mini" }, "הצגת QR");

    if (!qr.childNodes.length && window.QRCode) { try { new QRCode(qr, { text: link, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M }); } catch(e){} }

  const cerr = el("div", { class: "msg err" }); cerr.hidden = true;
  const setCode = async (code) => {
    if (!(await confirmBox("קוד חדש לסטודנטים", "הקוד הקודם יפסיק לעבוד. סטודנטים שכבר נכנסו יצטרכו את הקוד החדש בכניסה הבאה.", "החלפה"))) return;
    const d = await call("studentCode", { code });
    if (d.id) { apply(d); route(); toast("הקוד הוחלף"); } else { cerr.textContent = errText(d); cerr.hidden = false; }
  };
  wrap.append(el("div", { class: "card" },
    el("div", { class: "card-h" }, icon("key"), el("div", { class: "grow" }, el("h2", {}, "הקוד לסטודנטים"), el("p", { class: "sub" }, "קוד אחד לכל הקורס. הוא פותח צפייה בחומרים, הגשה והודעות — לא עריכה."))),
    el("div", { class: "codebox" }, el("div", { class: "bigcode" }, C.studentCode),
      el("div", { class: "row" }, el("button", { class: "mini", onclick: () => copy(ready, "ההודעה לסטודנטים הועתקה") }, line("copy"), "העתקת הודעה לסטודנטים"),
        el("button", { class: "mini", onclick: () => copy(link, "הקישור הועתק") }, line("link"), "העתקת הקישור"),
        el("a", { class: "mini", href: "https://wa.me/?text=" + encodeURIComponent(ready), target: "_blank", rel: "noopener" }, "שליחה בוואטסאפ"), qrBtn)),
    qr, el("div", { class: "ready" }, ready),
    el("label", { class: "f" }, "החלפת הקוד ", el("small", {}, "· קוד שקל לזכור, 6–16 אותיות לטיניות וספרות")),
    el("div", { class: "row" }, custom, el("button", { class: "btn sm", onclick: () => setCode(custom.value) }, "קביעה"), el("button", { class: "btn ghost sm", onclick: () => setCode("") }, "קוד אקראי חדש")), cerr));

  const t = el("input", { class: "t", value: C.title });
  const ab = el("textarea", { class: "t", style: "min-height:80px" }, C.about);
  const serr = el("div", { class: "msg err" }); serr.hidden = true;
  wrap.append(el("div", { class: "card" },
    el("div", { class: "card-h" }, icon("cap"), el("div", { class: "grow" }, el("h2", {}, "פרטי הקורס"))),
    field("שם הקורס", t), field("תיאור קצר", ab), serr,
    el("div", { class: "adder" }, el("button", { class: "btn", onclick: async () => {
      const d = await call("save", { patch: { title: t.value, about: ab.value } });
      if (d.id) { apply(d); shell(); route(); toast("נשמר"); } else { serr.textContent = errText(d); serr.hidden = false; }
    } }, "שמירה"), el("button", { class: "btn ghost", onclick: profileDialog }, icon("key"), "השם, המייל וקוד המרצה"))));
  wrap.append(el("div", { class: "card", style: "border-color:var(--coral-soft)" },
    el("div", { class: "card-h" }, el("div", { class: "grow" }, el("h3", {}, "מחיקת הקורס"), el("p", { class: "sub" }, "נמחקים השיעורים, החומרים, ההגשות וההודעות. אי אפשר לשחזר."))),
    el("button", { class: "btn danger", onclick: async () => {
      if (!(await confirmBox("מחיקת הקורס", "למחוק את \"" + (C.title || "הקורס") + "\" עם כל מה שבו?"))) return;
      const d = await call("courseDelete", { cid: C.id });
      if (d.courses) location.href = location.pathname; else toast(errText(d));
    } }, line("trash"), "מחיקת הקורס")));
  page.append(wrap);

boot();
